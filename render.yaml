services:
  - type: web
    name: engrafted-word-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.9"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WEBHOOK_CRON_SECRET
        generateValue: true
      - key: EMERGENT_EMAIL_KEY
        sync: false
      - key: EMAIL_FROM_NAME
        value: Engraved Word
      - key: EMAIL_REPLY_TO
        sync: false
